# CCN fork strings. Loaded after upstream's config/locales/i18n.yml (config/application.rb appends config/locales/ccn last).
# Other locales fall back to :en (config.i18n.fallbacks).
en:
  ccn_not_available_yet: Not available on this instance yet
  ccn_not_available_yet_hint_html: This DocuSeal Pro feature is being reimplemented in the <a class="link" href="%{url}" target="_blank" rel="noopener">CCN fork</a>.
  ccn_source_code: Source code of this instance
  ccn_formula_error: Formula could not be computed
  ccn_formula_error_zero_division: 'Formula could not be computed: division by zero'
  ccn_formula_error_not_a_number: 'Formula could not be computed: the result is not a real number'
  ccn_formula_error_out_of_range: 'Formula could not be computed: a value or the result is out of range'
  ccn_conversion_unavailable: 'Document conversion is unavailable on this instance right now (converter not reachable)'
  ccn_conversion_timeout: 'Document conversion timed out'
  ccn_conversion_rejected: 'The converter rejected this document (%{status})'
  ccn_invalid_document: 'Invalid document: %{message}'
  ccn_not_supported_yet: 'Not supported on this instance yet: %{feature}'
  ccn_template_not_found: 'Template not found: %{id}'
  ccn_pdf_encrypted: 'The PDF is password protected: pass its password or remove the protection'
  ccn_unsupported_file_type: 'Unsupported file type: %{type}'
