# CCN fork: build the docuseal-ccn image on GHCR for every "<upstream>-ccn.N" tag.
# Upstream's own docker.yml (Docker Hub, multi-arch) is disabled in this fork's Actions settings.
name: Build CCN image

on:
  push:
    tags:
      - "*.*.*-ccn.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .version file
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "$REF_NAME" > .version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag

      - name: Build and push (linux/amd64 only — the Coolify VM is x86_64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
